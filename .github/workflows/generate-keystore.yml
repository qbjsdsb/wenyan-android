name: Generate Keystore (One-time)

# 一次性 workflow：生成 release 签名用的 keystore。
#
# 运行方式：GitHub Actions → Workflow → "Generate Keystore (One-time)" → Run workflow
# 运行后从 Artifacts 下载 keystore.zip，解压得到 wenyan-release.jks，
# 然后手动添加到 GitHub Secrets：
#   - KEYSTORE_BASE64：wenyan-release.jks 的 base64 编码内容（keystore-base64.txt）
#   - KEYSTORE_PASSWORD：wenyan-release.jks 的密码（keystore-password.txt）
#   - KEY_ALIAS：密钥别名（key-alias.txt）
#   - KEY_PASSWORD：密钥密码（key-password.txt）
#
# 注意：生成的 keystore 有效期 25 年（9125 天），足以覆盖 App 整个生命周期。
# 下载后请妥善保管 keystore 文件，丢失后无法更新已发布的 App。

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate release keystore
        run: |
          mkdir -p keystore-output

          # 使用固定密码（简化配置，密码本身不敏感，keystore 文件才是密钥）
          KEYSTORE_PASSWORD="Wenyan2026Release"
          KEY_PASSWORD="Wenyan2026KeyPass"
          KEY_ALIAS="wenyan-release"

          echo "Generating keystore with 25-year validity..."
          echo "  KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD}"
          echo "  KEY_PASSWORD length: ${#KEY_PASSWORD}"
          echo "  KEY_ALIAS: $KEY_ALIAS"

          keytool -genkeypair \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9125 \
            -keystore keystore-output/wenyan-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Wenyan App, OU=Development, O=qbjsdsb, L=Nanjing, ST=Jiangsu, C=CN"

          # 保存密码和别名到文件（供下载后配置 Secrets）
          printf '%s' "$KEYSTORE_PASSWORD" > keystore-output/keystore-password.txt
          printf '%s' "$KEY_PASSWORD" > keystore-output/key-password.txt
          printf '%s' "$KEY_ALIAS" > keystore-output/key-alias.txt

          # 生成 base64 编码（供 GitHub Secrets 使用）
          base64 -w 0 keystore-output/wenyan-release.jks > keystore-output/keystore-base64.txt

          # 验证 keystore（用相同密码再次读取确认）
          echo "--- Keystore verification ---"
          keytool -list -keystore keystore-output/wenyan-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"

          # 验证密码文件内容
          echo "--- Password file verification ---"
          echo "keystore-password.txt content: $(cat keystore-output/keystore-password.txt)"
          echo "keystore-password.txt length: $(wc -c < keystore-output/keystore-password.txt)"
          echo "key-password.txt content: $(cat keystore-output/key-password.txt)"
          echo "key-password.txt length: $(wc -c < keystore-output/key-password.txt)"

          echo "--- Files generated ---"
          ls -la keystore-output/

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wenyan-keystore
          path: keystore-output/
          retention-days: 1
