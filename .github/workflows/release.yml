name: Release

# Tag 触发的 Release workflow。
#
# 触发方式：git tag v1.0.0 && git push origin v1.0.0
#
# 流程：
# 1. 从 GitHub Secrets 解码 keystore 到临时文件
# 2. 验证 keystore（storepass）
# 3. 运行单元测试（P1-CI-1 修正：先测试后构建）
# 4. 构建 signed release APK
# 5. 创建 GitHub Release 并附加 APK
#
# 前置条件（一次性配置）：
# 1. 运行 "Generate Keystore (One-time)" workflow
# 2. 下载 artifact，将以下内容添加到 GitHub Secrets：
#    - KEYSTORE_BASE64：keystore-base64.txt 内容
#    - KEYSTORE_PASSWORD：keystore-password.txt 内容
#    - KEY_ALIAS：key-alias.txt 内容
#    - KEY_PASSWORD：key-password.txt 内容（与 KEYSTORE_PASSWORD 相同，PKCS12 规范要求）

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # P1-CI-2 修正：添加超时保护，防止 Gradle 挂起无限占用 runner
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.4'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Decode keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # P1-S-1 修正：KEYSTORE_BASE64 未配置时 fail fast（exit 1），
          # 而非静默使用 debug 签名。debug keystore 公开，任何人都能签发
          # 相同包名 APK，存在安全风险。Release 必须用正式签名。
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "✗ ERROR: KEYSTORE_BASE64 secret 未配置，无法进行 Release 签名"
            echo "  请先运行 'Generate Keystore (One-time)' workflow，"
            echo "  再将 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 添加到 GitHub Secrets"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/wenyan-release.jks
          echo "✓ Keystore 已解码到 $RUNNER_TEMP/wenyan-release.jks"
          ls -la $RUNNER_TEMP/wenyan-release.jks

      - name: Verify keystore
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/wenyan-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "Verifying keystore with storepass..."
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -v

      # P1-CI-1 修正：先测试后构建。
      # 原顺序 assembleRelease → testDebugUnitTest，测试失败时 release APK 已构建，
      # 可能被错误发布。改为先 testDebugUnitTest，测试全绿后再构建 release APK。
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      # v0.9.22 新增：tag 与 app versionName 一致性校验（发布防呆）。
      # 防止推 v1.0.0 却发布 versionName 0.9.21 的"错版 APK"（v0.9.20 踩坑延伸）。
      # 校验在构建前执行，不一致立即 fail，避免浪费构建资源。
      - name: Verify tag matches versionName
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG_VERSION"
          # 防御：release.yml 触发条件是 tags:'v*'，但再校验一次 tag 格式
          case "$TAG_VERSION" in
            v*) ;;
            *) echo "✗ ERROR: tag 必须以 v 开头（如 v0.9.21）"; exit 1 ;;
          esac
          TAG_VERSION="${TAG_VERSION#v}"
          APP_VERSION="$(grep -oP '^\s*versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)"
          echo "App versionName: $APP_VERSION"
          if [ -z "$APP_VERSION" ]; then
            echo "✗ ERROR: 无法从 app/build.gradle.kts 解析 versionName"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "✗ ERROR: tag v$TAG_VERSION 与 app versionName \"$APP_VERSION\" 不一致"
            echo "  请先在 app/build.gradle.kts 提升 versionName 再打 tag"
            exit 1
          fi
          echo "✓ tag v$TAG_VERSION 与 versionName 一致"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/wenyan-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Rename APK with version
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/wenyan-${{ steps.version.outputs.VERSION }}.apk
          cp app/build/outputs/apk/release/app-release.apk release-assets/wenyan-latest.apk
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          # v0.9.21 修正：tag force-update 后同一 tag 重建时覆盖已有 release/APK，
          # 避免"已发布旧代码但新构建无法更新"（v0.9.20 踩坑：softprops 默认 skip）
          update_release: true
          name: 文研App ${{ steps.version.outputs.VERSION }}
          body: |
            ## 文研App ${{ steps.version.outputs.VERSION }}

            ### 下载安装

            1. 下载下方 `wenyan-${{ steps.version.outputs.VERSION }}.apk`
            2. 手机设置 → 允许安装未知来源应用
            3. 点击 APK 文件安装

            ### 功能特性

            - 知识点浏览（多教材对照 + 来源溯源 + 考频标识）
            - 论述题板块（134 题三维筛选 + 苏格拉底式 AI 审题助手）
            - 真题练习（科目代码历史适配 + 答题框架/范文）
            - 记忆卡片（FSRS-6 算法 + 三层记忆调度）
            - 错题本（手动加入 + FSRS 间隔重复复习）
            - AI助手（多服务商配置 + RAG 知识增强）
            - 软件内更新（自动检测 + 下载安装）
            - 导师信息（外链南师大文学院官网）

            ### 系统要求

            Android 8.0 (API 26) 及以上
          files: |
            release-assets/wenyan-${{ steps.version.outputs.VERSION }}.apk
            release-assets/wenyan-latest.apk
          draft: false
          prerelease: false
