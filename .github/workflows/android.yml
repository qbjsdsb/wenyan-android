name: Android Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # P1-CI-2 修正：添加超时保护，防止 Gradle 挂起无限占用 runner
    # （默认 6 小时太长，正常构建+测试 < 15 分钟，30 分钟足够）
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.4'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      # P1-CI-1 修正：先测试后构建。
      # 原顺序 assembleDebug → assembleRelease → testDebugUnitTest，
      # 测试失败时 APK 已构建，artifact 可能被下载使用。
      # 改为先 testDebugUnitTest，测试全绿后再构建 APK。
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wenyan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: wenyan-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
