name: Android Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # P1-CI-2 修正：添加超时保护，防止 Gradle 挂起无限占用 runner
    # （默认 6 小时太长，正常构建+测试 < 15 分钟，30 分钟足够）
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test seed audit
        run: python -m unittest discover -s tools/tests -p 'test*.py'

      - name: Audit seed deterministically
        run: |
          python -m tools.content_pipeline.audit_seed --seed app/src/main/assets/seed_data.json --schema content/schema/seed.schema.json --baseline content/baselines/seed-baseline.json --report "$RUNNER_TEMP/wenyan-seed-audit-1.json" --as-of-year 2026 --check
          python -m tools.content_pipeline.audit_seed --seed app/src/main/assets/seed_data.json --schema content/schema/seed.schema.json --baseline content/baselines/seed-baseline.json --report "$RUNNER_TEMP/wenyan-seed-audit-2.json" --as-of-year 2026 --check
          cmp "$RUNNER_TEMP/wenyan-seed-audit-1.json" "$RUNNER_TEMP/wenyan-seed-audit-2.json"

      - name: Upload seed audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wenyan-seed-audit
          path: ${{ runner.temp }}/wenyan-seed-audit-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.4'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      # P1-CI-1 修正：先测试后构建。
      # 原顺序 assembleDebug → assembleRelease → testDebugUnitTest，
      # 测试失败时 APK 已构建，artifact 可能被下载使用。
      # 改为先 testDebugUnitTest，测试全绿后再构建 APK。
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wenyan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
