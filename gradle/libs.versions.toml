# 文研App 版本目录，统一管理所有依赖版本
[versions]
# 构建工具与 Kotlin
agp = "8.6.0"
kotlin = "2.3.10"
# 注：使用 KSP 2.3.2 而非 2.3.10。KSP 2.3.10 调用 AndroidComponentsExtension.addKspConfigurations
# 方法（AGP 8.8+ 才有），与 AGP 8.6.0 不兼容。KSP 2.3.2 使用 legacy variant API，兼容 AGP 8.6+。
ksp = "2.3.2"

# Compose
composeBom = "2025.12.00"
# 显式锁定 material3 到 1.5.0-alpha18（覆盖 BOM 的 1.4.0）
# alpha18 是 AGP 8.6.0 可用的最新版本（alpha19+ 要求 AGP 9.1.0 + compileSdk 37）
# alpha18 传递依赖 Compose 1.11.0-beta02，同样兼容 AGP 8.6.0
# LargeFlexibleTopAppBar / MaterialExpressiveTheme / MotionScheme.expressive() 均为 experimental
material3 = "1.5.0-alpha18"
activityCompose = "1.9.1"
navigationCompose = "2.7.7"

# AndroidX 基础
coreKtx = "1.13.1"
lifecycle = "2.8.4"
material = "1.12.0"
# Splash Screen API（Android 12+ 系统支持 + 向后兼容）
coreSplashscreen = "1.0.1"
# LeakCanary 内存泄漏检测（仅 debug 构建）
leakcanary = "2.14"

# Hilt 依赖注入
hilt = "2.57.1"
hiltNavigationCompose = "1.2.0"

# Room 数据库
room = "2.7.0"

# Coroutines + Flow
coroutines = "1.8.1"

# 网络请求 Retrofit + OkHttp
retrofit = "2.9.0"
okhttp = "4.12.0"
# MockWebServer（流式 SSE 测试，与 okhttp 同版本）
mockwebserver = "4.12.0"

# Kotlinx Serialization
kotlinxSerialization = "1.6.3"
retrofitKotlinxSerialization = "1.0.0"

# DataStore 偏好存储
datastore = "1.1.1"

# FSRS-6 算法已由 FsrsWrapper.kt 自行实现，无需外部依赖

# MaterialKolor 动态色彩生成库（KSU 同款）
materialKolor = "4.1.1"

# Timber 结构化日志（v0.8.21 引入，替换 android.util.Log）
# 统一日志入口：Debug 构建打印到 Logcat，Release 构建经 ReleaseTree 仅记录 WARN/ERROR
# 单元测试无 plant() 时所有 Timber 调用 no-op，避免 android.util.Log "not mocked" 异常
timber = "5.0.1"

# Material 3 Adaptive（WindowSizeClass + ListDetailPaneScaffold，2025-10 稳定版）
# WideNavigationRail 已在 material3 1.5.0-alpha18 中，无需额外依赖
# adaptive 提供 currentWindowAdaptiveInfo() / WindowWidthSizeClass
material3Adaptive = "1.2.0"

# 测试
junit = "4.13.2"
androidxTestExtJunit = "1.2.1"
androidxTestEspresso = "3.6.1"
androidxTestCore = "1.6.1"
robolectric = "4.13"
turbine = "1.1.0"
coroutinesTest = "1.8.1"
sqliteJdbc = "3.41.2.2"

[libraries]
# Compose BOM
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
# Material 3 Adaptive（WindowSizeClass 驱动自适应布局）
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3Adaptive" }
# MaterialKolor 动态色彩
materialkolor = { group = "com.materialkolor", name = "material-kolor", version.ref = "materialKolor" }
# Timber 结构化日志（api 暴露：所有依赖 core:common 的模块可直接使用 Timber）
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# Compose Runtime（@Immutable/@Stable 注解，供 core 模块标记稳定类型，版本由 BOM 管理）
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }

# AndroidX 基础
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
# Splash Screen API（消除冷启动白屏）
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
# LeakCanary（debug 构建内存泄漏检测，自动初始化）
leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

# Navigation Compose
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# Room Testing（in-memory DB + MigrationTestHelper，供 SchedulingRepositoryTest 等真实事务测试）
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

# Retrofit + OkHttp
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxSerialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }

# Kotlinx Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-datastore-core = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }

# FSRS-6 算法已由 FsrsWrapper.kt 自行实现，无需外部库

# 测试
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }

# NF-B8 修复：移除 5 个 wenyan-feature-* 死声明。
# 各模块用 project(":feature:xxx") 引用，从未用 libs.wenyan.feature.xxx 别名。
# 死声明误导维护者以为有版本管理，实际从未被引用。
# v0.9.22 补充：同步移除 6 个 wenyan-core-* 死声明（core 模块同样用 project() 引用）。

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
