# 项目级配置
# 注：沙箱容器内存上限 5.8GB，Gradle daemon heap 从 4096m 降到 2048m
# 同时关掉 configuration-cache（首次构建时序列化整个任务图会消耗大量内存）
# 并禁用 Kotlin 编译 daemon（避免再开一个 JVM），改用 in-process 编译
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.workers.max=3

# Kotlin 编译器配置：禁用独立 daemon，在 Gradle daemon 进程内编译
kotlin.compiler.execution.strategy=in-process

# AndroidX 配置
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin 代码风格
kotlin.code.style=official

# 强制 Non-transitive R 类以加速构建
android.nonTransitiveAppRClass=true

# 临时绕过 AAR metadata 检查
# 计划文档假设 material3 1.5.0-alpha23 兼容 AGP 8.6.0，但实际 AAR metadata 声明
# minAgpVersion=9.1.0 + minCompileSdk=37。沙箱无 SDK 36/37，无法升级 compileSdk。
# 此属性仅为 Phase 0 验证关卡临时启用，让 Kotlin 代码层面编译验证能跑通。
# 待决策：升级 AGP 9.1.0 + SDK 37，或降级 material3 到兼容版本。
android.experimental.disableCheckAarMetadata=true
