# 项目级配置
# 注：沙箱容器内存上限 5.8GB（cgroup 4GB），Gradle daemon heap 2048m
# Metaspace 1g：Release 构建（R8 + Kotlin + Compose）需要加载大量类，
# 512m 在 :feature:aiassistant:compileReleaseKotlin 时 OOM（2026-07-12 CI 实测）
# 同时关掉 configuration-cache（首次构建时序列化整个任务图会消耗大量内存）
# 并禁用 Kotlin 编译 daemon（避免再开一个 JVM），改用 in-process 编译
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.workers.max=3

# Kotlin 编译器配置：禁用独立 daemon，在 Gradle daemon 进程内编译
kotlin.compiler.execution.strategy=in-process

# AndroidX 配置
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin 代码风格
kotlin.code.style=official

# 强制 Non-transitive R 类以加速构建
android.nonTransitiveAppRClass=true
